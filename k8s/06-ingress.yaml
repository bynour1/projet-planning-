# ─── Ingress Controller ──────────────────────────────────────
# Prérequis: nginx-ingress-controller installé
# kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.4/deploy/static/provider/cloud/deploy.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: planning-ingress
  namespace: planning-medical
  annotations:
    kubernetes.io/ingress.class:           "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # WebSocket support pour Socket.IO
    nginx.ingress.kubernetes.io/proxy-read-timeout:  "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout:  "3600"
    nginx.ingress.kubernetes.io/proxy-http-version:  "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # SSL (décommenter si vous avez cert-manager)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # tls:                                   # Décommenter pour HTTPS
  #   - hosts:
  #       - planning.votre-domaine.com
  #     secretName: planning-tls
  rules:
    - host: planning.votre-domaine.com    # ← Changer par votre domaine
      # Ou utiliser l'IP : supprimer le host pour accepter toutes connexions
      http:
        paths:
          # API backend
          - path:     /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8083
          # Socket.IO
          - path:     /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8083
          # Uploads (avatars, documents, chat attachments)
          - path:     /uploads
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8083
          # Frontend (catch-all)
          - path:     /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
