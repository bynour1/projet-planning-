# ─── Backend Deployment ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: planning-medical
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: planning-backend:latest    # remplacer par votre registry
          # image: votre-registry/planning-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: planning-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: planning-secrets
                  key:  jwt-secret
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: planning-secrets
                  key:  db-password
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: planning-secrets
                  key:  email-user
            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: planning-secrets
                  key:  email-pass
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads
          resources:
            requests:
              memory: "128Mi"
              cpu:    "100m"
            limits:
              memory: "512Mi"
              cpu:    "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser:    1001
            allowPrivilegeEscalation: false
      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: uploads-pvc

---
# ─── Backend Service ─────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: planning-medical
spec:
  selector:
    app: backend
  ports:
    - name: http
      port:       8083
      targetPort: 8083
  type: ClusterIP

---
# ─── HorizontalPodAutoscaler ─────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: planning-medical
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:        Deployment
    name:        backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type:               Utilization
          averageUtilization: 80
